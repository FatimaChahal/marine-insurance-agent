name: Marine Insurance Agent — CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Create .env for tests
      run: |
        echo "AZURE_ENDPOINT=${{ secrets.AZURE_ENDPOINT }}" >> .env
        echo "AZURE_API_KEY=${{ secrets.AZURE_API_KEY }}" >> .env
        echo "LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" >> .env
        echo "LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" >> .env
        echo "LANGFUSE_HOST=https://cloud.langfuse.com" >> .env

    - name: Run Guardrails tests
      run: python3 -m pytest tests/test_guardrails.py -v

    - name: Run RAG tests
      run: python3 -m pytest tests/test_rag.py -v

    - name: Run API tests
      run: python3 -m pytest tests/test_api.py -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t marine-insurance-agent .

    - name: Test Docker health
      run: |
        docker run -d -p 8000:8000 \
          -e AZURE_ENDPOINT=${{ secrets.AZURE_ENDPOINT }} \
          -e AZURE_API_KEY=${{ secrets.AZURE_API_KEY }} \
          -e LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }} \
          -e LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }} \
          -e LANGFUSE_HOST=https://cloud.langfuse.com \
          --name test-container marine-insurance-agent
        sleep 10
        curl -f http://localhost:8000/health
        docker stop test-container